<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Riyadhul Quran</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-mid) 60%, #1a2e08 100%);
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }
        .admin-login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .admin-login-card .card-header {
            background: var(--primary-green);
            border-bottom: 3px solid var(--accent-gold);
            padding: 30px 24px 24px;
            text-align: center;
        }
        .admin-login-card .card-header h4 {
            color: white;
            font-family: 'Merriweather', serif;
            margin: 0;
        }
        .admin-login-card .card-body {
            background: white;
            padding: 32px 28px;
        }
        .brand-logo {
            width: 64px;
            height: 64px;
            background: var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .brand-logo i { font-size: 1.8rem; color: var(--primary-green); }
        .footer-note {
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.78rem;
            padding: 16px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div>
            <div class="admin-login-card card">
                <div class="card-header">
                    <div class="brand-logo">
                        <i class="fa-solid fa-gauge"></i>
                    </div>
                    <h4>Admin Panel</h4>
                    <p class="mb-0 mt-1" style="color:rgba(255,255,255,0.7); font-size:0.85rem;">Riyadhul Quran</p>
                </div>
                <div class="card-body">
                    <p class="text-muted text-center small mb-4">Masuk untuk mengelola konten website pesantren.</p>
                    <form id="form-admin-login">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                                <input type="text" name="username" id="admin-username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="password" id="admin-password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
                                <button class="btn btn-outline-secondary" type="button" id="toggle-pw" tabindex="-1">
                                    <i class="fa-solid fa-eye" id="pw-icon"></i>
                                </button>
                            </div>
                        </div>
                        <div id="login-alert" class="alert d-none mb-3" role="alert"></div>
                        <button type="submit" id="login-btn" class="btn btn-apply w-100 py-2">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk ke Admin Panel
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="index.html" class="small text-muted text-decoration-none">
                            <i class="fa-solid fa-arrow-left me-1"></i>Kembali ke Website
                        </a>
                    </div>
                </div>
            </div>
            <div class="footer-note">
                &copy; 2026 Riyadhul Quran &mdash; Halaman ini tidak dipublikasikan
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Toggle show/hide password
        document.getElementById('toggle-pw').addEventListener('click', function() {
            var pw = document.getElementById('admin-password');
            var icon = document.getElementById('pw-icon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.className = 'fa-solid fa-eye-slash';
            } else {
                pw.type = 'password';
                icon.className = 'fa-solid fa-eye';
            }
        });

        // Submit login
        document.getElementById('form-admin-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            var alertBox = document.getElementById('login-alert');
            var btn = document.getElementById('login-btn');
            alertBox.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Memverifikasi...';

            var username = document.getElementById('admin-username').value;
            var password = document.getElementById('admin-password').value;

            try {
                var res = await fetch('/api/admin-login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                var json = await res.json();
                if (res.ok && json.success) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Login berhasil! Mengalihkan...';
                    alertBox.classList.remove('d-none');
                    setTimeout(function() {
                        window.location.href = 'admin.html';
                    }, 800);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = json.error || 'Login gagal.';
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Masuk ke Admin Panel';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Tidak dapat terhubung ke server.';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Masuk ke Admin Panel';
            }
        });
    </script>
</body>
</html>
