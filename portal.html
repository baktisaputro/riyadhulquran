<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal Akademik Wali Santri Pondok Pesantren Tahfidz Quran Riyadhul Quran.">
    <title>Riyadhul Quran - Portal Wali</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-light);
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .login-card .card-header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            border-radius: 12px 12px 0 0;
            padding: 25px;
        }
    </style>
</head>
<body>

    <nav id="site-navbar" class="navbar navbar-expand-lg sticky-top"></nav>

    <!-- Login -->
    <div class="login-wrapper">
        <div class="card login-card">
            <div class="card-header">
                <i class="fa-solid fa-user-graduate fa-3x mb-2"></i>
                <h4 class="mb-0">Portal Akademik Wali Santri</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center">Silakan masuk untuk memantau perkembangan akademik putra-putri Anda.</p>
                <form id="form-login">
                    <div class="mb-3">
                        <label class="form-label">Username / Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-user"></i></span>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>
                    <div id="login-alert" class="alert d-none" role="alert"></div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Ingat saya</label>
                        </div>
                        <a href="#" class="link-theme">Lupa password?</a>
                    </div>
                    <button type="submit" id="login-btn" class="btn btn-login w-100 py-2">Masuk</button>
                </form>
                <hr>
                <p class="text-center text-muted small mb-0">Belum punya akun? Silakan hubungi bagian tata usaha pesantren untuk aktivasi akun wali santri.</p>
            </div>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async function (e) {
            e.preventDefault();
            var alertBox = document.getElementById('login-alert');
            var btn = document.getElementById('login-btn');
            var data = Object.fromEntries(new FormData(this).entries());
            alertBox.classList.add('d-none');
            btn.disabled = true;
            try {
                var res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                var json = await res.json();
                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Berhasil masuk. Selamat datang, ' + json.user.nama + '!';
                    localStorage.setItem('pp_wali', JSON.stringify(json.user));
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = json.error || 'Gagal masuk.';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Tidak dapat terhubung ke server.';
            }
            alertBox.classList.remove('d-none');
            btn.disabled = false;
        });
    </script>
</body>
</html>
