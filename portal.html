<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal Akademik Wali Santri Pondok Pesantren Tahfidz Quran Riyadhul Quran.">
    <title>Riyadhul Quran - Portal Wali</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; background-color: var(--bg-light); }
        .login-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }
    </style>
</head>
<body>

    <div class="top-bar d-none d-lg-block">
        <div class="container d-flex justify-content-between align-items-center">
            <div><i class="fa-solid fa-location-dot me-2"></i> Kadiresa RT 06, Triwidadi, Pajangan, Bantul, Yogyakarta</div>
            <div><a href="index.html"><i class="fa-solid fa-house me-1"></i> Beranda</a></div>
        </div>
    </div>

    <nav id="site-navbar" class="navbar navbar-expand-lg sticky-top"></nav>

    <div class="login-wrapper">
        <div class="card login-card">
            <div class="card-header">
                <i class="fa-solid fa-user-graduate fa-3x mb-3 d-block" style="color:var(--accent-gold);"></i>
                <h4 class="mb-0 serif-font">Portal Akademik Wali Santri</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">Silakan masuk untuk memantau perkembangan akademik putra-putri Anda.</p>
                <form id="form-login">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Masukkan username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                        </div>
                    </div>
                    <div id="login-alert" class="alert d-none" role="alert"></div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label small" for="remember">Ingat saya</label>
                        </div>
                        <a href="#" class="small" style="color:var(--primary-green);">Lupa password?</a>
                    </div>
                    <button type="submit" id="login-btn" class="btn btn-apply w-100 py-2">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Masuk
                    </button>
                </form>
                <hr class="my-4">
                <p class="text-center text-muted small mb-0">Belum punya akun? Silakan hubungi bagian tata usaha pesantren untuk aktivasi akun wali santri.</p>
            </div>
        </div>
    </div>

    <footer id="site-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async function (e) {
            e.preventDefault();
            var alertBox = document.getElementById('login-alert');
            var btn = document.getElementById('login-btn');
            var data = Object.fromEntries(new FormData(this).entries());
            alertBox.classList.add('d-none');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Memverifikasi...';
            try {
                var res = await fetch('/api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                var json = await res.json();
                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Berhasil masuk. Selamat datang, ' + json.user.nama + '!';
                    localStorage.setItem('user_portal', JSON.stringify(json.user));
                    localStorage.setItem('pp_wali', JSON.stringify(json.user));
                    setTimeout(function() {
                        window.location.href = 'portal-dashboard.html';
                    }, 1000);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = json.error || 'Gagal masuk.';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Tidak dapat terhubung ke server.';
            }
            alertBox.classList.remove('d-none');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-2"></i>Masuk';
        });
    </script>
</body>
</html>
